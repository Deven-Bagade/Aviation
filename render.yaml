services:
  # Optional mirror of the dashboard
  - type: web
    name: uav-twin-dashboard
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

  # Secure telemetry WebSocket server
  - type: web
    name: uav-twin-telemetry
    runtime: node
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node server/render-entry.js
    healthCheckPath: /
    envVars:
      - key: TELEMETRY_SHARED_SECRET
        generateValue: true